<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DDD Dainagon Ice Puzzle</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        overflow: hidden;
        height: 100%;
        overscroll-behavior: none;
      }

      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #fce4ec 0%, #e0f7fa 50%, #ede7f6 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Nunito', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #game-root {
        touch-action: none;
        width: 100vw;
        height: 100vh;
      }

      #game-root canvas {
        display: block;
        border: 3px solid rgba(255, 133, 161, 0.45);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(255, 133, 161, 0.2);
      }

      /* Phaser DOM 内の input はグローバルスタイルを無効化 */
      #game-root input {
        width: auto !important;
        border: none !important;
        border-radius: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        padding: 0 !important;
        transition: none !important;
      }
      #game-root input:focus {
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script src="/phaser/phaser.min.js"></script>
    <script src="/config.js"></script>
    <script type="module" src="/js/app-init.js"></script>
  </body>
</html>
